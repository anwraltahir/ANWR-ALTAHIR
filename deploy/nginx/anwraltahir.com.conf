server {
    listen 80;
    listen [::]:80;
    server_name anwraltahir.com www.anwraltahir.com;

    root /home/ubuntu/anwr/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
